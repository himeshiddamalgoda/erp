        "401": *a5
        "403": *a6
        "404": *a7
        "409": *a8
        "422": *a9
        "500": *a10
    delete:
      operationId: deleteQuotation
      summary: Soft-delete Draft
      description: Only Draft in an unlocked family. Retains lines, audit and used revision number.
      tags:
        - Quotations
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
            example: '"3"'
      responses:
        "204":
          description: Soft-deleted; no body
        "400": *a4
        "401": *a5
        "403": *a6
        "404": *a7
        "409": *a8
        "422": *a9
        "500": *a10
  /quotations/{id}/submit:
    parameters:
      - *a15
    post:
      operationId: submitQuotation
      summary: Draft to PendingApproval
      description: Requires active buyer with contact (email/phone), billing/shipping addresses, validUntil,
        requestedDeliveryDate, paymentTerms and positive prices. Captures customer/address/garment snapshots. Commercial
        fields then freeze.
      tags:
        - Quotations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionAction"
            example:
              version: 1
      responses:
