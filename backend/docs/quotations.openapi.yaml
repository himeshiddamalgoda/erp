openapi: 3.0.3
info:
  title: Garment ERP Quotations
  version: 1.0.0
  description: Revision IDs identify commercial offers within one family. Exactly 15 quotation operations. Trusted server
    middleware supplies req.user = {id, role, salesTeamIds}. Authentication/login is outside this module; no client
    actor IDs/roles are accepted. Development-only fixed principals are configured by server environment, never HTTP
    headers. USD/LKR/GBP/EUR only, two decimals, PCS integer quantities, no FX/tax/freight/discounts. Company timezone
    defaults to Asia/Colombo; validUntil includes its entire local date. Dates in examples are illustrative; demo data
    uses future relative dates. See quotations.md for setup, roles and UI mapping.
servers:
  - url: /api/v1
tags:
  - name: Quotations
paths:
  /quotations:
    get:
      operationId: listQuotations
      summary: List quotations
      description: Defaults to latest nondeleted revision per family. Status and other filters apply after latest selection.
        includeRevisions=true includes history. Scope uses authorized teams. Commercial dates are inclusive; ordering
        always includes ID.
      tags:
        - Quotations
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema: &a19
            type: string
            enum: &a22
              - Draft
              - PendingApproval
              - Approved
              - Issued
              - Accepted
              - Declined
              - Expired
              - Superseded
              - Cancelled
              - Converted
        - name: customerId
          in: query
          schema: &a1
            type: string
            format: uuid
        - name: salesTeamId
          in: query
          schema: *a1
        - name: ownerId
          in: query
          schema: *a1
        - name: fromDate
          in: query
          schema: &a2
            type: string
            format: date
        - name: toDate
          in: query
          schema: *a2
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - quotationDate
              - quoteNumber
              - total
              - updatedAt
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: includeRevisions
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paged quotation summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuotationSummary"
                  meta:
                    type: object
                    additionalProperties: false
                    properties:
                      page: &a3
                        type: integer
                        minimum: 1
                      pageSize: *a3
                      total:
                        type: integer
                        minimum: 0
                    required:
                      - page
                      - pageSize
                      - total
                required:
                  - data
                  - meta
              example:
                data:
                  - id: 80000000-0000-4000-8000-000000000001
                    familyId: 90000000-0000-4000-8000-000000000001
                    quoteNumber: QT-2026-0001
                    revision: 1
                    status: Draft
                    customerId: 30000000-0000-4000-8000-000000000001
                    customerName: Ocean Apparel
                    salesTeamId: 20000000-0000-4000-8000-000000000001
                    ownerId: 10000000-0000-4000-8000-000000000001
                    currency: USD
                    totalQty: 1000
                    subtotal: "5500.00"
                    total: "5500.00"
                    validUntil: 2026-10-31
                    requestedDeliveryDate: 2026-11-30
                    version: 1
                    createdAt: 2026-10-16T04:00:00.000Z
                    updatedAt: 2026-10-16T04:00:00.000Z
                meta:
                  page: 1
                  pageSize: 20
                  total: 1
        "400": &a4
          description: Malformed JSON, query or required header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_REQUEST
                  message: Malformed JSON, query or required header
                  requestId: req-example
        "401": &a5
          description: A valid trusted principal is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: UNAUTHENTICATED
                  message: A valid trusted principal is required
                  requestId: req-example
        "403": &a6
          description: Action is not permitted for this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: Action is not permitted for this role
                  requestId: req-example
        "404": &a7
          description: Quotation not found or outside visible scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: Quotation not found or outside visible scope
                  requestId: req-example
        "409": &a8
          description: Lifecycle, version, expiry or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                STALE_VERSION:
                  value:
                    error:
                      code: STALE_VERSION
                      message: Quotation changed; reload before retrying
                      requestId: req-example
                INVALID_TRANSITION:
                  value:
                    error:
                      code: INVALID_TRANSITION
                      message: INVALID_TRANSITION
                      requestId: req-example
                QUOTATION_EXPIRED:
                  value:
                    error:
                      code: QUOTATION_EXPIRED
                      message: QUOTATION_EXPIRED
                      requestId: req-example
                FAMILY_ALREADY_ACCEPTED:
                  value:
                    error:
                      code: FAMILY_ALREADY_ACCEPTED
                      message: FAMILY_ALREADY_ACCEPTED
                      requestId: req-example
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                      message: IDEMPOTENCY_KEY_REUSED
                      requestId: req-example
                WORKING_REVISION_EXISTS:
                  value:
                    error:
                      code: WORKING_REVISION_EXISTS
                      message: WORKING_REVISION_EXISTS
                      requestId: req-example
        "422": &a9
          description: Field validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Check highlighted fields
                  fields:
                    lines[0].qty: Must be a positive integer
                  requestId: req-example
        "500": &a10
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
                  requestId: req-example
    post:
      operationId: createQuotation
      summary: Create Draft family and revision 1
      description: Generates quote number and exact totals server-side. Missing final terms, validity and addresses are
        allowed for Draft. Buyer/team/owner and variants must be active.
      tags:
        - Quotations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotation"
