  /quotations/{id}/convert:
    parameters:
      - *a15
    post:
      operationId: convertQuotation
      summary: Convert accepted revision to one Draft order
      description: Requires Idempotency-Key. Locks reservation then family/revision, validates accepted link and active
        buyer/team/owner, and copies accepted snapshots/lines exactly. Acceptance remains convertible after validUntil.
        First success 201; identical key/payload replays saved status/body. Reused key/different payload 409. New key on
        an existing conversion returns linked identity with 200 before stale-version checks, including deleted/archived
        state. No production, shipping, invoice or payment is started.
      tags:
        - Quotations
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
            minLength: 1
          example: d0000000-0000-4000-8000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionAction"
            example:
              version: 5
      responses:
        "200":
          description: Existing linked order with a new key (may be archived), or replay of a saved 200
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/SalesOrderSummary"
                required:
                  - data
              example:
                data:
                  id: a0000000-0000-4000-8000-000000000001
                  salesOrderId: a0000000-0000-4000-8000-000000000001
                  orderNumber: SO-2026-0001
                  status: Draft
                  sourceQuotationId: 80000000-0000-4000-8000-000000000001
                  sourceQuoteNumber: QT-2026-0001
                  sourceRevision: 1
                  currency: USD
                  totalQty: 1000
                  subtotal: "5500.00"
                  total: "5500.00"
                  version: 1
                  deletedAt: 2026-11-01T00:00:00.000Z
                  archived: true
        "201":
          description: Created Draft sales order, or replay of the original 201
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/SalesOrderSummary"
                required:
                  - data
              example:
                data:
                  id: a0000000-0000-4000-8000-000000000001
                  salesOrderId: a0000000-0000-4000-8000-000000000001
                  orderNumber: SO-2026-0001
                  status: Draft
                  sourceQuotationId: 80000000-0000-4000-8000-000000000001
                  sourceQuoteNumber: QT-2026-0001
                  sourceRevision: 1
                  currency: USD
                  totalQty: 1000
                  subtotal: "5500.00"
                  total: "5500.00"
                  version: 1
                  deletedAt: null
                  archived: false
        "400": *a4
        "401": *a5
        "403": *a6
        "404": *a7
        "409": *a8
        "422": *a9
        "500": *a10
components:
  schemas:
    LineInput:
      type: object
      additionalProperties: false
      properties:
        styleId: *a1
        colour:
          type: string
          maxLength: 60
          minLength: 1
        size:
          type: string
          maxLength: 30
          minLength: 1
        qty:
          type: integer
          minimum: 1
          maximum: 1000000
        unitPrice:
          type: string
          pattern: ^(?:0|[1-9]\d{0,7})(?:\.\d{1,2})?$
          example: "5.50"
      required:
        - styleId
        - colour
        - size
        - qty
        - unitPrice
    CreateQuotation:
      type: object
      additionalProperties: false
      properties:
        customerId: *a1
        salesTeamId: *a1
        ownerId: *a1
        currency: &a23
          type: string
          maxLength: 3
          enum:
            - USD
            - LKR
            - GBP
            - EUR
        quotationDate: *a2
        validUntil: &a24
          type: string
          format: date
