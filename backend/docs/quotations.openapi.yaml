                - styleId: 50000000-0000-4000-8000-000000000001
                  colour: White
                  size: L
                  qty: 100
                  unitPrice: "5.50"
      responses:
        "201":
          description: Created Draft revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/QuotationDetail"
                required:
