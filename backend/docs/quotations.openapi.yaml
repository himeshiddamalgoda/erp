  /quotations/{id}:
    parameters:
      - &a15
        name: id
        in: path
        required: true
        schema: *a1
        description: Quotation revision ID, not family ID.
    get:
      operationId: getQuotation
      summary: Read revision detail
      description: Includes scoped revision summaries, audit, stored commercial snapshots, linked order (including archived
        state), and allowedActions. Draft garments and draftBuyer reflect current masters; frozen statuses use stored
        snapshots. allowedActions does not replace server validation.
      tags:
        - Quotations
      responses:
        "200":
          description: Quotation detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/QuotationDetail"
                required:
                  - data
              example:
                data: *a11
        "400": *a4
        "401": *a5
        "403": *a6
        "404": *a7
        "409": *a8
        "422": *a9
        "500": *a10
    patch:
      operationId: patchQuotation
      summary: Edit Draft
      description: Requires current version and an unlocked family. Omitted fields stay unchanged. Supplied lines replace the
        entire collection and IDs may change. No generic status/number/total/actor patch is allowed.
      tags:
        - Quotations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchQuotation"
            example:
              version: 1
              lines:
                - styleId: 50000000-0000-4000-8000-000000000001
                  colour: Navy
                  size: S
                  qty: 1000
                  unitPrice: "5.50"
      responses:
        "200":
          description: Updated Draft
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/QuotationDetail"
                required:
                  - data
              example:
                data:
                  id: 80000000-0000-4000-8000-000000000001
                  familyId: 90000000-0000-4000-8000-000000000001
                  quoteNumber: QT-2026-0001
                  revision: 1
                  status: Draft
                  customerId: 30000000-0000-4000-8000-000000000001
                  customerName: Ocean Apparel
                  salesTeamId: 20000000-0000-4000-8000-000000000001
                  ownerId: 10000000-0000-4000-8000-000000000001
                  currency: USD
                  totalQty: 1000
                  subtotal: "5500.00"
                  total: "5500.00"
                  validUntil: 2026-10-31
